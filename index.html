<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Body Particle Light Stage</title>
    <meta
      name="description"
      content="A camera-driven full-body particle light stage that reacts to arms, hands, torso, legs, jumps, and dance energy."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23020106'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff2fd2'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%2344fff4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="particle-canvas" aria-label="全身动作驱动粒子光场"></canvas>

    <main class="stage-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="eyebrow">BODY LIGHT STAGE</span>
          <h1>全身动作粒子光场</h1>
        </div>
        <div class="signal-readout" aria-live="polite">
          <span class="signal-dot" id="signal-dot"></span>
          <span id="camera-status">摄像头未启动</span>
        </div>
      </header>

      <section class="hud-panel" aria-label="粒子状态">
        <div class="mode-row">
          <span class="mode-label">当前状态</span>
          <strong id="gesture-name">等待</strong>
        </div>
        <p id="gesture-copy">点击启动摄像头，或直接移动鼠标预览全身动作光效。</p>
        <div class="meter" aria-label="识别置信度">
          <span id="confidence-meter"></span>
        </div>
      </section>

      <aside class="gesture-strip" aria-label="动作映射">
        <button class="gesture-chip active" data-demo="hands-up" type="button">
          <span>举手</span>
          <small>光柱</small>
        </button>
        <button class="gesture-chip" data-demo="clap" type="button">
          <span>拍手</span>
          <small>爆核</small>
        </button>
        <button class="gesture-chip" data-demo="wave" type="button">
          <span>挥臂</span>
          <small>光带</small>
        </button>
        <button class="gesture-chip" data-demo="leg-kick" type="button">
          <span>抬腿</span>
          <small>刀光</small>
        </button>
        <button class="gesture-chip" data-demo="jump" type="button">
          <span>跳跃</span>
          <small>地环</small>
        </button>
        <button class="gesture-chip" data-demo="twist" type="button">
          <span>转身</span>
          <small>旋涡</small>
        </button>
        <button class="gesture-chip" data-demo="dance" type="button">
          <span>跳舞</span>
          <small>高能</small>
        </button>
      </aside>

      <section class="control-dock" aria-label="控制区">
        <button id="start-camera" class="primary-action" type="button">
          启动全身识别
        </button>
        <button id="toggle-video" class="ghost-action" type="button" aria-pressed="false">
          显示画面
        </button>
        <span class="dock-note" id="dock-note">允许浏览器摄像头权限后，让头、双手、躯干和腿进入画面。</span>
      </section>

      <div class="video-monitor" id="video-monitor" aria-hidden="true">
        <video id="input-video" playsinline muted></video>
        <canvas id="hand-overlay"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
