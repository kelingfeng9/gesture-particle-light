<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Particle Light Field</title>
    <meta
      name="description"
      content="A camera-driven gesture particle light field that reacts to eight single-hand gestures with distinct particle colors and forms."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23020106'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff2fd2'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%2344fff4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="particle-canvas" aria-label="手势驱动粒子光场"></canvas>

    <main class="stage-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="eyebrow">GESTURE FIELD</span>
          <h1>手势粒子光场</h1>
        </div>
        <div class="signal-readout" aria-live="polite">
          <span class="signal-dot" id="signal-dot"></span>
          <span id="camera-status">摄像头未启动</span>
        </div>
      </header>

      <section class="hud-panel" aria-label="粒子状态">
        <div class="mode-row">
          <span class="mode-label">当前状态</span>
          <strong id="gesture-name">等待</strong>
        </div>
        <p id="gesture-copy">点击启动摄像头，或直接移动鼠标预览粒子收缩状态。</p>
        <div class="meter" aria-label="识别置信度">
          <span id="confidence-meter"></span>
        </div>
      </section>

      <aside class="gesture-strip" aria-label="手势映射">
        <button class="gesture-chip active" data-demo="open" type="button">
          <span>张开</span>
          <small>外扩</small>
        </button>
        <button class="gesture-chip" data-demo="fist" type="button">
          <span>握拳</span>
          <small>收缩</small>
        </button>
        <button class="gesture-chip" data-demo="pinch" type="button">
          <span>捏合</span>
          <small>光核</small>
        </button>
        <button class="gesture-chip" data-demo="point" type="button">
          <span>指向</span>
          <small>光束</small>
        </button>
        <button class="gesture-chip" data-demo="sweep" type="button">
          <span>挥动</span>
          <small>潮汐</small>
        </button>
        <button class="gesture-chip" data-demo="victory" type="button">
          <span>V形</span>
          <small>双螺旋</small>
        </button>
        <button class="gesture-chip" data-demo="three" type="button">
          <span>三指</span>
          <small>放射</small>
        </button>
        <button class="gesture-chip" data-demo="rock" type="button">
          <span>摇滚</span>
          <small>闪电</small>
        </button>
      </aside>

      <section class="control-dock" aria-label="控制区">
        <button id="start-camera" class="primary-action" type="button">
          启动摄像头
        </button>
        <button id="toggle-video" class="ghost-action" type="button" aria-pressed="false">
          显示画面
        </button>
        <span class="dock-note" id="dock-note">允许浏览器摄像头权限后，手放进画面中央。</span>
      </section>

      <div class="video-monitor" id="video-monitor" aria-hidden="true">
        <video id="input-video" playsinline muted></video>
        <canvas id="hand-overlay"></canvas>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
